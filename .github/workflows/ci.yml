name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root & Frontend Dependencies
        run: |
          npm ci
          cd frontend && npm ci && cd ..

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Linting
        run: |
          npm run lint
          cd frontend && npm run lint && cd ..

      - name: Run Unit & Integration Test Suites
        run: |
          npx vitest run --reporter=verbose 2>&1 | tee test_results.txt || {
            cat test_results.txt >> $GITHUB_STEP_SUMMARY
            cat test_results.txt
            exit 1
          }

      - name: Run End-to-End Programmatic Verification
        run: npm run test:e2e

      - name: Build Full Production Bundle
        run: npm run build
